# Fly.io. Create the volume once:  fly volumes create joe_data --size 1 --region <your-region>
# SQLite means exactly ONE machine. Do not scale this app past 1.
app = "threads-by-joe"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/threadsbyjoe.db"

[mounts]
  source = "joe_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
